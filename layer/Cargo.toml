[package]
name = "linuxvr-viewshot-layer"
version = "0.4.5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "OpenXR API layer: take photos in VR with a hand-frame gesture"

[lib]
name = "linuxvr_viewshot_layer"
crate-type = ["cdylib"]

[dependencies]
openxr-sys = "0.14"
ash = "0.38"
png = "0.18"
dirs = "7"
chrono = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

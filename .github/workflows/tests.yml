# Tests bei jedem Push und Pull Request: Rust-Layer + Python-UI.
# Läuft auf GitHub (Ubuntu) – lokal geht dasselbe mit:
#   cargo test   ·   python3 -m pytest -q tests   ·   python3 tests/smoke.py
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:   # auch per Knopf unter "Actions" startbar

jobs:
  rust:
    name: Rust-Layer (cargo test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  python:
    name: Python-UI (pytest + Smoke-Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: UI/requirements.txt
      # Bibliotheken, die Qt auch ohne Bildschirm (offscreen) braucht
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      # rapidocr/onnxruntime sind optional – die Tests laufen ohne
      - run: pip install PyQt6 pytest
      - run: python -m pytest -q tests
      - run: python tests/smoke.py
        env:
          QT_QPA_PLATFORM: offscreen

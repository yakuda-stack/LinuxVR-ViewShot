[package]
name = "linuxvr-viewshot-daemon"
version = "1.0.5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Background service: OCR + translation + VR panel without the desktop app"

[[bin]]
name = "viewshot-daemon"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "7"
chrono = "0.4"
regex = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
shlex = "1"
libc = "0.2"
rqrr = "0.10"
tiny-skia = "0.11"
cosmic-text = "0.14"
gif = "0.14"  # 🗜 gif-shrink (dieselbe Version wie in image)
